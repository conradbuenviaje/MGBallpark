name: Supabase keep-alive

# Free-tier Supabase projects pause after ~7 days of inactivity, which makes
# the calculator show no data. This pings the REST API every 5 days to keep
# the project active. The anon key is public (it ships in js/config.js), so
# it is safe to inline here. Runs on GitHub Actions (free for public repos).

on:
  schedule:
    - cron: "17 3 */5 * *"   # 03:17 UTC, every 5 days
  workflow_dispatch: {}        # allow manual "Run workflow"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF2dXZudHloeXJvbXptbnpoenpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0NTUzODYsImV4cCI6MjA5ODAzMTM4Nn0.pxY1Z6jws02UDWsNlWi4DXy4VGnf93GLfXkO83OVrrk" \
            "https://qvuvntyhyromzmnzhzzs.supabase.co/rest/v1/settings?select=id&limit=1")
          echo "Supabase REST responded: HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::warning::Unexpected status $code (project may be paused — restore it in the Supabase dashboard)."
          fi
