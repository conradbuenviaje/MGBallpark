name: Update supplier data

# Scrapes the Lark procurement base (via the public proxy) and commits
# data/suppliers.json + data/rate-suggestions.json.
#
# SCHEDULE PAUSED (2026-11-12): the Lark base now requires a signed-in USER
# token to read, which a headless cron cannot obtain (it needs an interactive
# browser login). Until that's resolved, refresh the data manually with the
# local login tool (tools/supplier-sync/index.html) and commit the files. The cron
# is disabled; the manual "Run workflow" button is kept but will fail until the
# auth model changes (e.g. the app is added to the base, or a refresh token is
# wired up).

on:
  # schedule:
  #   - cron: '30 20 * * *'   # 20:30 UTC daily = 04:30 Asia/Manila (PAUSED)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-suppliers
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scrape supplier data
        id: scrape
        run: |
          set +e
          python scripts/scrape_suppliers.py
          code=$?
          if [ "$code" = "3" ]; then
            echo "Proxy returned too few records (asleep/down). Skipping commit."
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit $code

      - name: Commit if changed
        if: steps.scrape.outputs.skip != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/suppliers.json data/rate-suggestions.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh supplier data + rate suggestions [skip ci]"
            git push
          fi
